<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin - Bot Plugin Hub</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 25px;
    }

    input,
    button {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      box-sizing: border-box;
      font-size: 16px;
    }

    button {
      cursor: pointer;
    }

    #adminPanel {
      display: none;
    }

    #message {
      margin-top: 20px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }

    .info {
      color: #555;
    }

    .testBox {
      margin-top: 25px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

  </style>

</head>


<body>


  <!-- LOGIN -->

  <div id="loginBox">

    <h1>🔐 Admin Login</h1>


    <input
      type="email"
      id="email"
      placeholder="Admin Email"
      autocomplete="email"
    >


    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >


    <button id="loginBtn">
      Login
    </button>


    <p id="message" class="info">
      Checking Supabase connection...
    </p>


    <div class="testBox">

      <strong>🔎 Connection Test</strong>

      <p id="testResult">
        Testing...
      </p>

    </div>

  </div>



  <!-- ADMIN PANEL -->

  <div id="adminPanel">

    <h1>🛠️ Admin Panel</h1>

    <p>
      Welcome, Admin! ✅
    </p>

    <p id="userInfo"></p>

    <button id="logoutBtn">
      Logout
    </button>

  </div>



  <script type="module">


    /*
     * SUPABASE
     * =========================
     */

    import {
      createClient
    } from
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';



    /*
     * SUPABASE CONFIG
     * =========================
     */

    const SUPABASE_URL =
      'https://vsrljoydwxrwtiqfasp.supabase.co';


    const SUPABASE_KEY =
      'sb_publishable_xSD13T4p8GAByYCTWYjw9g_xfn49aSj';



    /*
     * CREATE CLIENT
     * =========================
     */

    const supabase =
      createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );



    /*
     * ELEMENTS
     * =========================
     */

    const loginBox =
      document.getElementById(
        'loginBox'
      );


    const adminPanel =
      document.getElementById(
        'adminPanel'
      );


    const message =
      document.getElementById(
        'message'
      );


    const testResult =
      document.getElementById(
        'testResult'
      );


    const emailInput =
      document.getElementById(
        'email'
      );


    const passwordInput =
      document.getElementById(
        'password'
      );


    const loginBtn =
      document.getElementById(
        'loginBtn'
      );


    const logoutBtn =
      document.getElementById(
        'logoutBtn'
      );


    const userInfo =
      document.getElementById(
        'userInfo'
      );



    /*
     * MESSAGE
     * =========================
     */

    function showMessage(
      text,
      type = 'info'
    ) {

      message.textContent = text;

      message.className = type;

    }



    /*
     * AUTH CONNECTION TEST
     * =========================
     */

    async function testAuthConnection() {

      testResult.textContent =
        'Testing Supabase Auth...';

      testResult.className =
        'info';


      try {

        const response =
          await fetch(
            SUPABASE_URL +
            '/auth/v1/settings',
            {
              method: 'GET',

              headers: {
                'apikey':
                  SUPABASE_KEY
              }
            }
          );


        const responseText =
          await response.text();


        if (response.ok) {

          testResult.textContent =
            '✅ Supabase Auth is reachable.\n\n' +
            'HTTP Status: ' +
            response.status +
            '\n\nResponse:\n' +
            responseText;

          testResult.className =
            'success';

        } else {

          testResult.textContent =
            '❌ Supabase Auth returned an error.\n\n' +
            'HTTP Status: ' +
            response.status +
            '\n\nResponse:\n' +
            responseText;

          testResult.className =
            'error';

        }


      } catch (error) {

        testResult.textContent =
          '❌ AUTH CONNECTION FAILED\n\n' +
          error.message;

        testResult.className =
          'error';

      }

    }



    /*
     * CHECK ADMIN
     * =========================
     */

    async function checkAdmin(user) {

      if (!user) {

        return false;

      }


      const {
        data,
        error
      } = await supabase
        .from('admins')
        .select('user_id')
        .eq(
          'user_id',
          user.id
        )
        .maybeSingle();


      if (error) {

        throw new Error(
          'Admin check failed:\n' +
          error.message
        );

      }


      return !!data;

    }



    /*
     * SHOW ADMIN PANEL
     * =========================
     */

    function showAdminPanel(user) {

      loginBox.style.display =
        'none';


      adminPanel.style.display =
        'block';


      userInfo.textContent =
        'Logged in as: ' +
        user.email;

    }



    /*
     * SHOW LOGIN
     * =========================
     */

    function showLogin() {

      loginBox.style.display =
        'block';


      adminPanel.style.display =
        'none';


      userInfo.textContent =
        '';

    }



    /*
     * LOGIN
     * =========================
     */

    loginBtn.addEventListener(
      'click',
      async () => {


        const email =
          emailInput.value.trim();


        const password =
          passwordInput.value;


        if (!email) {

          showMessage(
            'Email required!',
            'error'
          );

          return;

        }


        if (!password) {

          showMessage(
            'Password required!',
            'error'
          );

          return;

        }


        loginBtn.disabled =
          true;


        loginBtn.textContent =
          'Logging in...';


        showMessage(
          'Connecting to Supabase...',
          'info'
        );


        try {


          /*
           * SIGN IN
           */

          const {
            data,
            error
          } = await supabase.auth
            .signInWithPassword({

              email: email,

              password: password

            });



          /*
           * LOGIN ERROR
           */

          if (error) {

            showMessage(
              'LOGIN ERROR:\n\n' +
              error.message +
              '\n\nError name: ' +
              (
                error.name ||
                'Unknown'
              ) +
              '\n\nStatus: ' +
              (
                error.status ||
                'Unknown'
              ),
              'error'
            );

            return;

          }



          /*
           * USER
           */

          const user =
            data.user;


          if (!user) {

            showMessage(
              'Login completed but user was not returned.',
              'error'
            );

            return;

          }



          /*
           * ADMIN CHECK
           */

          showMessage(
            'Login successful!\n\nChecking admin access...',
            'info'
          );


          const isAdmin =
            await checkAdmin(user);


          if (!isAdmin) {

            await supabase.auth.signOut();


            showMessage(
              'ACCESS DENIED!\n\n' +
              'This account is not registered as an admin.',
              'error'
            );

            return;

          }



          /*
           * SUCCESS
           */

          showAdminPanel(user);


        } catch (error) {

          showMessage(
            'UNEXPECTED ERROR:\n\n' +
            error.message,
            'error'
          );

        } finally {

          loginBtn.disabled =
            false;


          loginBtn.textContent =
            'Login';

        }

      }
    );



    /*
     * LOGOUT
     * =========================
     */

    logoutBtn.addEventListener(
      'click',
      async () => {

        try {

          await supabase.auth
            .signOut();


          showLogin();


          emailInput.value =
            '';


          passwordInput.value =
            '';


          showMessage(
            'Logged out successfully.',
            'success'
          );


        } catch (error) {

          showMessage(
            'Logout error:\n\n' +
            error.message,
            'error'
          );

        }

      }
    );



    /*
     * CHECK EXISTING SESSION
     * =========================
     */

    async function checkExistingSession() {

      try {

        const {
          data,
          error
        } = await supabase.auth
          .getSession();


        if (error) {

          showMessage(
            'SESSION ERROR:\n\n' +
            error.message,
            'error'
          );

          return;

        }


        if (
          data.session &&
          data.session.user
        ) {

          const isAdmin =
            await checkAdmin(
              data.session.user
            );


          if (isAdmin) {

            showAdminPanel(
              data.session.user
            );

          } else {

            await supabase.auth
              .signOut();

          }

        }

      } catch (error) {

        showMessage(
          'STARTUP ERROR:\n\n' +
          error.message,
          'error'
        );

      }

    }



    /*
     * START TEST
     * =========================
     */

    testAuthConnection();


    /*
     * START SESSION CHECK
     * =========================
     */

    checkExistingSession();


  </script>


</body>

</html>
