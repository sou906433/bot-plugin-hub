<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bot Plugin Hub - Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .card {
      background: #1e293b;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 15px;
      border: 1px solid #475569;
      border-radius: 8px;
      background: #0f172a;
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #38bdf8;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      margin-top: 8px;
    }

    .login-btn {
      background: #22c55e;
      color: white;
    }

    .test-btn {
      background: #38bdf8;
      color: #082f49;
    }

    .logout-btn {
      background: #ef4444;
      color: white;
    }

    button:active {
      transform: scale(0.98);
    }

    .result {
      margin-top: 15px;
      padding: 14px;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
    }

    .info {
      background: #172554;
      color: #bfdbfe;
    }

    .success {
      background: #052e16;
      color: #86efac;
    }

    .error {
      background: #450a0a;
      color: #fca5a5;
    }

    #adminPanel {
      display: none;
    }

    .status {
      text-align: center;
      margin-bottom: 15px;
      color: #94a3b8;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>⚡ Bot Plugin Hub</h1>

    <!-- CONNECTION TEST -->
    <div class="card">

      <h2>🔌 Supabase Connection</h2>

      <p class="status">
        Testing Supabase Auth connection
      </p>

      <button
        class="test-btn"
        id="testButton"
      >
        Test Auth Connection
      </button>

      <div
        id="testResult"
        class="result info"
      >
        Waiting for test...
      </div>

    </div>


    <!-- LOGIN -->
    <div
      class="card"
      id="loginCard"
    >

      <h2>🔐 Admin Login</h2>

      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="Admin email"
        autocomplete="email"
      >

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Admin password"
        autocomplete="current-password"
      >

      <button
        class="login-btn"
        id="loginButton"
      >
        Login
      </button>

      <div
        id="loginResult"
        class="result info"
      >
        Enter your admin login details.
      </div>

    </div>


    <!-- ADMIN PANEL -->
    <div
      class="card"
      id="adminPanel"
    >

      <h2>🛠️ Admin Panel</h2>

      <div
        id="adminInfo"
        class="result success"
      ></div>

      <button
        class="logout-btn"
        id="logoutButton"
      >
        Logout
      </button>

    </div>

  </div>


  <script type="module">

    /*
     * ============================================================
     * SUPABASE CONFIG
     * ============================================================
     */

    const SUPABASE_URL =
      'https://vsrljoydwxrwtiqfasp.supabase.co';


    /*
     * IMPORTANT:
     * এখানে তোমার আগের sb_publishable_... key বসাও।
     *
     * Secret key / service_role key এখানে কখনো বসাবে না।
     */

    const SUPABASE_KEY =
      'sb_publishable_xSD13T4p8GAByYCTWYjw9g_xfn49aSj';


    /*
     * ============================================================
     * IMPORT SUPABASE
     * ============================================================
     */

    import {
      createClient
    } from
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';


    /*
     * ============================================================
     * CREATE CLIENT
     * ============================================================
     */

    const supabase =
      createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /*
     * ============================================================
     * ELEMENTS
     * ============================================================
     */

    const testButton =
      document.getElementById(
        'testButton'
      );

    const testResult =
      document.getElementById(
        'testResult'
      );

    const loginButton =
      document.getElementById(
        'loginButton'
      );

    const loginResult =
      document.getElementById(
        'loginResult'
      );

    const logoutButton =
      document.getElementById(
        'logoutButton'
      );

    const loginCard =
      document.getElementById(
        'loginCard'
      );

    const adminPanel =
      document.getElementById(
        'adminPanel'
      );

    const adminInfo =
      document.getElementById(
        'adminInfo'
      );

    const emailInput =
      document.getElementById(
        'email'
      );

    const passwordInput =
      document.getElementById(
        'password'
      );


    /*
     * ============================================================
     * TEST AUTH CONNECTION
     * ============================================================
     *
     * এবার apikey header ব্যবহার করছি না।
     *
     * apikey query parameter দিয়ে request যাচ্ছে।
     * এতে custom-header CORS/preflight সমস্যা আছে কিনা
     * আলাদা করে বোঝা যাবে।
     */

    async function testAuthConnection() {

      testResult.textContent =
        'Testing Supabase Auth...';

      testResult.className =
        'result info';


      try {

        const url =
          SUPABASE_URL +
          '/auth/v1/settings?apikey=' +
          encodeURIComponent(
            SUPABASE_KEY
          );


        const response =
          await fetch(
            url,
            {
              method: 'GET'
            }
          );


        const responseText =
          await response.text();


        if (response.ok) {

          testResult.textContent =
            '✅ AUTH CONNECTION WORKING\n\n' +
            'HTTP Status: ' +
            response.status +
            '\n\n' +
            'Supabase Auth replied successfully.\n\n' +
            'Response:\n' +
            responseText;

          testResult.className =
            'result success';

        } else {

          testResult.textContent =
            '❌ AUTH SERVER REPLIED\n\n' +
            'HTTP Status: ' +
            response.status +
            '\n\n' +
            'Response:\n' +
            responseText;

          testResult.className =
            'result error';

        }

      } catch (error) {

        testResult.textContent =
          '❌ NETWORK / CORS ERROR\n\n' +
          'Message:\n' +
          error.message +
          '\n\n' +
          'The browser could not complete the request.';

        testResult.className =
          'result error';

      }

    }


    /*
     * ============================================================
     * LOGIN
     * ============================================================
     */

    async function login() {

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;


      if (!email || !password) {

        loginResult.textContent =
          '❌ Please enter email and password.';

        loginResult.className =
          'result error';

        return;

      }


      loginResult.textContent =
        'Logging in...';

      loginResult.className =
        'result info';


      try {

        const {
          data,
          error
        } =
          await supabase.auth
            .signInWithPassword({
              email,
              password
            });


        if (error) {

          loginResult.textContent =
            '❌ LOGIN FAILED\n\n' +
            error.message;

          loginResult.className =
            'result error';

          return;

        }


        if (!data || !data.user) {

          loginResult.textContent =
            '❌ Login succeeded but user data was not returned.';

          loginResult.className =
            'result error';

          return;

        }


        /*
         * ========================================================
         * CHECK ADMIN
         * ========================================================
         */

        const {
          data: adminData,
          error: adminError
        } =
          await supabase
            .from('admins')
            .select('user_id')
            .eq(
              'user_id',
              data.user.id
            )
            .maybeSingle();


        if (adminError) {

          loginResult.textContent =
            '❌ ADMIN CHECK FAILED\n\n' +
            adminError.message;

          loginResult.className =
            'result error';

          return;

        }


        if (!adminData) {

          loginResult.textContent =
            '❌ ACCESS DENIED\n\n' +
            'This account is not registered as an admin.';

          loginResult.className =
            'result error';

          await supabase.auth.signOut();

          return;

        }


        /*
         * ========================================================
         * ADMIN LOGIN SUCCESS
         * ========================================================
         */

        loginResult.textContent =
          '✅ LOGIN SUCCESSFUL';

        loginResult.className =
          'result success';


        loginCard.style.display =
          'none';

        adminPanel.style.display =
          'block';


        adminInfo.textContent =
          '✅ Admin access granted.\n\n' +
          'User ID:\n' +
          data.user.id;


      } catch (error) {

        loginResult.textContent =
          '❌ LOGIN ERROR\n\n' +
          error.message;

        loginResult.className =
          'result error';

      }

    }


    /*
     * ============================================================
     * LOGOUT
     * ============================================================
     */

    async function logout() {

      await supabase.auth.signOut();


      adminPanel.style.display =
        'none';

      loginCard.style.display =
        'block';


      emailInput.value =
        '';

      passwordInput.value =
        '';


      loginResult.textContent =
        'Logged out successfully.';

      loginResult.className =
        'result info';

    }


    /*
     * ============================================================
     * BUTTON EVENTS
     * ============================================================
     */

    testButton.addEventListener(
      'click',
      testAuthConnection
    );


    loginButton.addEventListener(
      'click',
      login
    );


    logoutButton.addEventListener(
      'click',
      logout
    );


    /*
     * ============================================================
     * ENTER KEY LOGIN
     * ============================================================
     */

    passwordInput.addEventListener(
      'keydown',
      function(event) {

        if (
          event.key === 'Enter'
        ) {

          login();

        }

      }
    );


    /*
     * ============================================================
     * INITIAL AUTH CHECK
     * ============================================================
     */

    async function checkExistingSession() {

      try {

        const {
          data,
          error
        } =
          await supabase.auth
            .getSession();


        if (error) {

          console.log(
            'Session check error:',
            error
          );

          return;

        }


        if (
          data &&
          data.session &&
          data.session.user
        ) {

          const user =
            data.session.user;


          const {
            data: adminData,
            error: adminError
          } =
            await supabase
              .from('admins')
              .select('user_id')
              .eq(
                'user_id',
                user.id
              )
              .maybeSingle();


          if (
            !adminError &&
            adminData
          ) {

            loginCard.style.display =
              'none';

            adminPanel.style.display =
              'block';

            adminInfo.textContent =
              '✅ Existing admin session found.\n\n' +
              'User ID:\n' +
              user.id;

          }

        }

      } catch (error) {

        console.log(
          'Session check failed:',
          error
        );

      }

    }


    /*
     * ============================================================
     * START
     * ============================================================
     */

    checkExistingSession();

  </script>

</body>
</html>
